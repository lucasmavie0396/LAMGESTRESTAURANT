name: App Android

on:
  push:
    branches: [main, android-venda]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lamgest.keystore"
            echo "ANDROID_KEYSTORE_FICHEIRO=$RUNNER_TEMP/lamgest.keystore" >> "$GITHUB_ENV"
          fi
      - name: Compilar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/compilacao.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LAMGest-Venda.apk"
      - name: Publicar na release app-venda
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-venda >/dev/null 2>&1 || gh release create app-venda --prerelease --title "LAMGest Venda (Android)" --notes "APK da app de venda, gerado automaticamente." --target "$GITHUB_SHA"
          [ -f "$RUNNER_TEMP/compilacao.log" ] && gh release upload app-venda "$RUNNER_TEMP/compilacao.log" --clobber
          [ -f "$RUNNER_TEMP/LAMGest-Venda.apk" ] && gh release upload app-venda "$RUNNER_TEMP/LAMGest-Venda.apk" --clobber
          true
